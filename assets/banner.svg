<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
<style>
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#8a8378;letter-spacing:1px}
.name{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', 'DejaVu Serif', serif;font-size:64px;fill:#1f1d1a;font-weight:700;letter-spacing:-1px}
.old{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', 'DejaVu Serif', serif;font-size:28px;font-style:italic;fill:#8a8378}
.new{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', 'DejaVu Serif', serif;font-size:30px;font-style:italic;font-weight:700;fill:#d6452f}
</style>
<rect x="0.5" y="0.5" width="859" height="299" rx="14" fill="#f5efe4" stroke="#e4dccd"/>
<text x="48" y="54" class="mono">README.MD — EST. 2022</text>
<text x="812" y="54" class="mono" text-anchor="end">GITHUB.COM/RUSHABHSINGWI</text>
