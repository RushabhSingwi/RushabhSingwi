<path d="M44 214 C 110 206, 180 220, 250 210 S 330 206, 372 212" fill="none" stroke="#d6452f" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
  <animate attributeName="stroke-dashoffset" from="360" to="0" begin="0.6s" dur="0.6s" fill="freeze"/>
</path>
